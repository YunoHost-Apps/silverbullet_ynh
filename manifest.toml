#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "silverbullet"
name = "SilverBullet"
description.en = "Creative space where you collect, create and expand your personal knowledge"
description.fr = "Espace créatif où vous recueillez, créez et élargissez vos connaissances personnelles"

version = "2.12.0~ynh2"

maintainers = ["fflorent"]

[upstream]
license = "MIT"
website = "https://silverbullet.md"
code = "https://github.com/silverbulletmd/silverbullet"
fund = "https://silverbullet.md/Funding"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = [ "amd64", "arm64" ]
multi_instance = true

ldap = false
sso = false

disk = "100M"
ram.build = "50M"
ram.runtime = "250M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "Who can reach SilverBullet? (SilverBullet always asks for its own login)"
    help.fr = "Qui peut accéder à SilverBullet ? (SilverBullet demande toujours sa propre connexion)"
    type = "group"
    default = "admins"

    [install.admin]
    help.en = "YunoHost user used for the SilverBullet admin account"
    help.fr = "Utilisateur YunoHost utilisé pour le compte admin SilverBullet"
    type = "user"

    [install.admin_pw]
    ask.en = "Password for the SilverBullet admin user"
    ask.fr = "Mot de passe de l'utilisateur admin SilverBullet"
    help.en = "Separate from the YunoHost password, stored hashed in the app data folder."
    help.fr = "Distinct du mot de passe YunoHost, stocké haché dans les données de l'app."
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir=false

    amd64.url = "https://github.com/silverbulletmd/silverbullet/releases/download/2.12.0/silverbullet-server-linux-x86_64.zip"
    amd64.sha256 = "1b921a183cb4d4b8fe67243dd52a1b6a49abc63dc1f5a3ca4089c778029528ff"
    arm64.url = "https://github.com/silverbulletmd/silverbullet/releases/download/2.12.0/silverbullet-server-linux-aarch64.zip"
    arm64.sha256 = "473e5ca0efe002bb36577062892d5ffff1b5ba43ed99d34268946820574c0563"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^silverbullet-server-linux-x86_64.zip$"
    autoupdate.asset.arm64 = "^silverbullet-server-linux-aarch64.zip$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = [ "notes" ]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.ports]
    main.default = 3000
