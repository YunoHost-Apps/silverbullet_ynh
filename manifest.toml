#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "silverbullet"
name = "SilverBullet"
description.en = "Creative space where you collect, create and expand your personal knowledge"
description.fr = "Espace créatif où vous recueillez, créez et élargissez vos connaissances personnelles"

version = "2.11.1~ynh2"

maintainers = ["fflorent"]

[upstream]
license = "MIT"
website = "https://silverbullet.md"
code = "https://github.com/silverbulletmd/silverbullet"
fund = "https://silverbullet.md/Funding"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = [ "amd64", "arm64" ]
multi_instance = true

ldap = false
sso = false

disk = "500M"
ram.build = "512M"
ram.runtime = "350M"

[install]
    [install.domain]
    type = "domain"

    [install.admin]
    help.en = "Choose the user who can access to silverbullet"
    help.fr = "Choisissez l'utilisateur pouvant accéder à silverbullet"
    type = "user"

    [install.enable_mcp]
    ask.en = "Enable the MCP sidecar (expose notes to LLMs via /mcp)?"
    ask.fr = "Activer le sidecar MCP (exposer les notes aux LLM via /mcp) ?"
    help.en = "Installs a small Node.js bridge exposing the SilverBullet HTTP API as a Model Context Protocol server. No Chromium needed. A SilverBullet API token (created in /.dashboard) must be pasted in the app config panel afterwards. Can be toggled later in the config panel."
    help.fr = "Installe un petit pont Node.js exposant l'API HTTP SilverBullet comme serveur Model Context Protocol. Sans Chromium. Un token API SilverBullet (créé dans /.dashboard) devra être collé dans le panneau de configuration ensuite. Modifiable plus tard dans le panneau de configuration."
    type = "boolean"
    default = 0
    yes = 1
    no = 0

    [install.init_mcp_permission]
    help.en = "Who can reach the MCP endpoint (/mcp)? A client token is still required."
    help.fr = "Qui peut joindre le point d'accès MCP (/mcp) ? Un token client reste requis."
    type = "group"
    default = "admins"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir=false

    amd64.url = "https://github.com/silverbulletmd/silverbullet/releases/download/2.11.1/silverbullet-server-linux-x86_64.zip"
    amd64.sha256 = "82af0d5d008c377cdb4b49dbd21db0d21f8d14619efa40b0fdeae1dce778d018"
    arm64.url = "https://github.com/silverbulletmd/silverbullet/releases/download/2.11.1/silverbullet-server-linux-aarch64.zip"
    arm64.sha256 = "4ca826b88431fcbe8d4c8f4d7d3f8cc3b076d42f724a40b6dc4d45a676d9dd87"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^silverbullet-server-linux-x86_64.zip$"
    autoupdate.asset.arm64 = "^silverbullet-server-linux-aarch64.zip$"

    [resources.sources.mcp]
    url = "https://github.com/Ahmad-A0/silverbullet-mcp/archive/refs/tags/v1.2.0.tar.gz"
    sha256 = "90b28bb091667fd66acda7a91dfdef2cf9a2a57dfbcc16fba4840338a94f45ea"
    in_subdir = true
    autoupdate.strategy = "latest_github_tag"

    [resources.nodejs]
    version = "22"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = [ "notes" ]

    [resources.permissions]
    main.url = "/"
    main.allowed = "admins"
    mcp.url = "/mcp"
    mcp.auth_header = false
    mcp.show_tile = false
    mcp.allowed = "admins"

    [resources.ports]
    main.default = 3000
    mcp.default = 4000
