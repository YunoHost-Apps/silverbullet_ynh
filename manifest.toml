#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "silverbullet"
name = "SilverBullet"
description.en = "Creative space where you collect, create and expand your personal knowledge"
description.fr = "Espace créatif où vous recueillez, créez et élargissez vos connaissances personnelles"

version = "2.11.1~ynh3"

maintainers = ["fflorent"]

[upstream]
license = "MIT"
website = "https://silverbullet.md"
code = "https://github.com/silverbulletmd/silverbullet"
fund = "https://silverbullet.md/Funding"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = [ "amd64", "arm64" ]
multi_instance = true

ldap = false
sso = false

disk = "100M"
ram.build = "50M"
ram.runtime = "250M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "Who can reach SilverBullet? (SilverBullet always asks for its own login)"
    help.fr = "Qui peut accéder à SilverBullet ? (SilverBullet demande toujours sa propre connexion)"
    type = "group"
    default = "admins"

    [install.init_api_permission]
    help.en = "Who can reach the SilverBullet HTTP API (/.fs)? Bearer tokens are still required."
    help.fr = "Qui peut joindre l'API HTTP SilverBullet (/.fs) ? Un token Bearer reste requis."
    type = "group"
    default = "visitors"

    [install.admin]
    help.en = "Choose the user who will own the SilverBullet space"
    help.fr = "Choisissez l'utilisateur propriétaire de l'espace SilverBullet"
    type = "user"

    [install.admin_pw]
    ask.en = "Choose a password for this SilverBullet admin user"
    ask.fr = "Choisissez un mot de passe pour cet utilisateur administrateur SilverBullet"
    help.en = "This password is only used to create the SilverBullet account. It is stored as a hash in the app data folder and is not the YunoHost account password."
    help.fr = "Ce mot de passe sert uniquement à créer le compte SilverBullet. Il est stocké sous forme de hash dans les données de l'application et n'est pas le mot de passe du compte YunoHost."
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir=false

    amd64.url = "https://github.com/silverbulletmd/silverbullet/releases/download/2.11.1/silverbullet-server-linux-x86_64.zip"
    amd64.sha256 = "82af0d5d008c377cdb4b49dbd21db0d21f8d14619efa40b0fdeae1dce778d018"
    arm64.url = "https://github.com/silverbulletmd/silverbullet/releases/download/2.11.1/silverbullet-server-linux-aarch64.zip"
    arm64.sha256 = "4ca826b88431fcbe8d4c8f4d7d3f8cc3b076d42f724a40b6dc4d45a676d9dd87"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^silverbullet-server-linux-x86_64.zip$"
    autoupdate.asset.arm64 = "^silverbullet-server-linux-aarch64.zip$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = [ "notes" ]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false
    api.url = "/.fs"
    api.auth_header = false
    api.show_tile = false
    api.allowed = "visitors"

    [resources.ports]
    main.default = 3000
