#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {
  proxy_pass http://127.0.0.1:__PORT__;
  include proxy_params_no_auth;
  proxy_redirect off;
  client_max_body_size 10M;
}

# SilverBullet MCP sidecar (streamable HTTP). The matching SSO permission
# is managed separately (mcp.allowed), SilverBullet auth is not involved here:
# clients authenticate with MCP_TOKEN as Authorization: Bearer.
location = __PATH__mcp {
  proxy_pass http://127.0.0.1:__PORT_MCP__;
  include proxy_params_no_auth;
  proxy_redirect off;
  client_max_body_size 10M;
}
location __PATH__mcp/ {
  proxy_pass http://127.0.0.1:__PORT_MCP__;
  include proxy_params_no_auth;
  proxy_redirect off;
  client_max_body_size 10M;
}
